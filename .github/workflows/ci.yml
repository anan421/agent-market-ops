name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Leak check
        run: python scripts/leak_check.py
      - name: Validate demo data
        run: python scripts/validate_demo.py
      - name: Pytest
        run: pytest -q

  markets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: gen
        run: echo "matrix=$(python -c 'import json, markets; print(json.dumps(markets.available()))')" >> "$GITHUB_OUTPUT"

  per-market:
    needs: markets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        market: ${{ fromJSON(needs.markets.outputs.matrix) }}
    env:
      AMO_MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate (${{ matrix.market }})
        run: python scripts/validate_demo.py
      - name: Pytest (${{ matrix.market }})
        run: pytest -q
